<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Internet Access by Country</title>
    <link rel="stylesheet" href="style.css"
          onerror="document.body.innerHTML='<pre style=color:blue;padding:20px>❌ ERROR: style.css not found.</pre>'+document.body.innerHTML"/>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@700;800&display=swap" rel="stylesheet"/>
</head>
<body>
<header>
    <h1>Population By Country</h1>
    <p>ArrayListArrayList&lt;Country&gt; &rarr; Live Visualizationlt;CountryArrayList&lt;Country&gt; &rarr; Live Visualizationgt; ArrayList&lt;Country&gt; &rarr; Live Visualizationrarr; Live Visualization</p>
</header>

<main>
    <div class="card">
        <p class="chart-title">&#9616; Bar Chart — People</p>
        <div id="barChart" class="status">Fetching from Java server...</div>
    </div>

    <div class="card" id="lineCard" style="display:none">
        <p class="chart-title">&#9616; Line Chart</p>
        <svg id="lineChart" viewBox="0 0 760 200" preserveAspectRatio="none" height="200"></svg>
    </div>

    <div id="statsRow" style="display:none">
        <div class="stats" id="stats"></div>
    </div>

    <div class="btn-row">
        <button class="btn" onclick="loadData()">&#8634; Refresh Data</button>
    </div>
</main>

<script src="code.js"
        onerror="document.body.innerHTML='<pre style=color:red;padding:20px>❌ ERROR: code.js not found.</pre>'+document.body.innerHTML">
</script>
</body>
</html>
